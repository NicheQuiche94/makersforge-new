name: Daily job ingest

# Pulls fresh in-remit roles from the ATS boards in src/data/sources.json and
# commits the updated src/data/jobs.json. Pushing to the default branch triggers
# Vercel's production deploy, so the board refreshes itself once a day.
#
# Runs only on the default branch (activates once this work is merged). Trigger
# it by hand any time from the Actions tab via "Run workflow".

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

# Allow the workflow to commit the regenerated jobs.json back to the repo.
permissions:
  contents: write

concurrency:
  group: job-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # CRM sync + enrichment steps read these. Add them as repo secrets:
    # Settings → Secrets and variables → Actions → New repository secret.
    env:
      FOLK_API_KEY: ${{ secrets.FOLK_API_KEY }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies to install — the script uses only Node built-ins + fetch.
      - name: Run ingest
        run: node scripts/ingest.mjs

      # Refresh the outreach priority list (days-open per role).
      - name: Hot leads
        run: node scripts/hot-leads.mjs

      - name: Commit & push if the board changed
        run: |
          if [[ -n "$(git status --porcelain src/data/jobs.json docs/weekly-roles.md docs/hot-leads.md)" ]]; then
            git config user.name "makersforge-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/jobs.json docs/weekly-roles.md docs/hot-leads.md
            git commit -m "chore(jobs): daily ingest $(date -u +%F)"
            git push
            echo "Board updated."
          else
            echo "No changes to publish."
          fi

      # --- CRM automation (Folk + Apollo). Runs after the board is committed so
      # a CRM/API hiccup never blocks the board refresh. Each step is best-effort.
      # Skipped automatically if the secrets aren't set. ---

      # 1. Sync every tracked company into Folk + refresh the HIRING NOW flag
      #    from today's board. Free (Folk API only), idempotent, deduped.
      - name: Folk — sync companies + refresh hiring flags
        if: ${{ env.FOLK_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/folk-sync-radar.mjs --commit

      # 2. Add a decision-maker to newly-added companies that already have a
      #    domain. Capped at 25/run so credit spend stays bounded.
      - name: Apollo — enrich new domained leads (cap 25)
        if: ${{ env.FOLK_API_KEY != '' && env.APOLLO_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/folk-enrich-contacts.mjs --all --limit=25

      # 3. Resolve a domain (guarded org-search) for name-only leads, then enrich.
      #    Hard-capped at 25 reveals/run — automation can never overspend.
      - name: Apollo — resolve domains + enrich name-only leads (cap 25)
        if: ${{ env.FOLK_API_KEY != '' && env.APOLLO_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/apollo-resolve-enrich.mjs --max-reveals=25
