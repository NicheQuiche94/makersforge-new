<?xml version="1.0" encoding="UTF-8"?>
<!--
  MakersForge emblem. Bare, white on transparent.

  Faded hex outline at 12% white plus solid white MF inner mark.
  Matches the ghost emblem rendered in the homepage hero. Place this
  on any dark surface and the hex reads as a subtle outline with the
  MF mark on top. On light surfaces the hex stroke disappears.

  Use this when you want to lay the logo over your own background.
  For the heat-glow tile baked in, use emblem-hero.svg instead.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-3 -3 203 219"
  width="1024"
  height="1107"
  role="img"
  aria-label="MakersForge"
>
  <polygon
    fill="#ffffff"
    points="140.93 90.75 140.93 103.83 157.95 103.83 174.97 116.91 140.93 116.91 140.93 129.99 123.91 116.91 123.91 90.75 72.84 90.75 106.89 116.91 89.86 129.99 140.93 129.99 140.93 143.06 55.82 143.06 89.86 116.91 72.84 103.83 55.82 103.83 21.78 77.67 174.97 77.67 174.97 103.83 157.95 90.75 140.93 90.75"
  />
  <polygon
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-miterlimit="10"
    stroke-width="9"
    points="193.25 157.74 193.25 55.23 98.38 3.98 3.5 55.23 3.5 157.74 98.38 209 193.25 157.74"
  />
</svg>
